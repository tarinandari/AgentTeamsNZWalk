<header class="page-header">
  <h2>{{ isEditMode() ? 'Edit Difficulty' : 'Add Difficulty' }}</h2>
  <p class="page-subtitle">
    {{ isEditMode() ? 'Update the name for this difficulty rating.' : 'Add a new difficulty rating for walks.' }}
  </p>
</header>

@if (error()) {
  <div class="error-banner">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error() }}</span>
  </div>
}

<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>{{ isEditMode() ? 'Difficulty details' : 'New difficulty' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-fields">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Easy" />
      </mat-form-field>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="18" class="spacer-inline-spinner" />
          } @else {
            Save
          }
        </button>
        <button mat-button type="button" routerLink="/difficulties">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
